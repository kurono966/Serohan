name: Build Serohan documentation

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'build.py'
      - '.github/workflows/build-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: serohan-docs-main
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate HTML from Markdown
        run: python build.py

      - name: Commit regenerated site if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "docs: regenerate site from Markdown [skip ci]"
          git push
